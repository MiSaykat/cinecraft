<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="logoBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070b14" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Titanium Dark Slate -->
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Shield Base with Subtle Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#070b14" stroke="#1e293b" stroke-width="4" />
  <circle cx="256" cy="256" r="210" fill="url(#logoBgGlow)" />

  <!-- Outer Radar Reticle Ring with Precision Tick Marks -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-dasharray="8 12" />
  <circle cx="256" cy="256" r="165" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="3" />

  <!-- 4 Corner Drone Motor Struts & Rotor Guards -->
  <!-- Top-Left Rotor Arm -->
  <line x1="256" y1="256" x2="130" y2="130" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" />
  <circle cx="130" cy="130" r="38" fill="url(#slateGrad)" stroke="url(#cyanGrad)" stroke-width="5" />
  <circle cx="130" cy="130" r="14" fill="#38bdf8" />
  <path d="M 100,130 A 30,30 0 0,1 160,130" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Top-Right Rotor Arm -->
  <line x1="256" y1="256" x2="382" y2="130" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" />
  <circle cx="382" cy="130" r="38" fill="url(#slateGrad)" stroke="url(#cyanGrad)" stroke-width="5" />
  <circle cx="382" cy="130" r="14" fill="#38bdf8" />
  <path d="M 352,130 A 30,30 0 0,1 412,130" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Bottom-Left Rotor Arm -->
  <line x1="256" y1="256" x2="130" y2="382" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" />
  <circle cx="130" cy="382" r="38" fill="url(#slateGrad)" stroke="url(#cyanGrad)" stroke-width="5" />
  <circle cx="130" cy="382" r="14" fill="#38bdf8" />
  <path d="M 100,382 A 30,30 0 0,1 160,382" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Bottom-Right Rotor Arm -->
  <line x1="256" y1="256" x2="382" y2="382" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" />
  <circle cx="382" cy="382" r="38" fill="url(#slateGrad)" stroke="url(#cyanGrad)" stroke-width="5" />
  <circle cx="382" cy="382" r="14" fill="#38bdf8" />
  <path d="M 352,382 A 30,30 0 0,1 412,382" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Central Camera Gimbal & Cinema Aperture Core -->
  <circle cx="256" cy="256" r="115" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="6" filter="url(#coreGlow)" />
  <circle cx="256" cy="256" r="95" fill="#090d16" stroke="rgba(245, 158, 11, 0.4)" stroke-width="3" />

  <!-- The Iconic CineCraft 'C' Monogram Aperture Ribbon -->
  <!-- Outer Arc of C -->
  <path d="M 320,195 A 80,80 0 1,0 320,317 L 290,290 A 46,46 0 1,1 290,222 Z" 
        fill="url(#cyanGrad)" />

  <!-- Gold Inner Optical Iris Blades -->
  <polygon points="256,190 274,228 238,228" fill="url(#goldGrad)" opacity="0.9" />
  <polygon points="314,236 290,270 270,240" fill="url(#goldGrad)" opacity="0.8" />
  <polygon points="296,306 256,314 274,276" fill="url(#goldGrad)" opacity="0.9" />
  <polygon points="220,306 202,268 238,268" fill="url(#goldGrad)" opacity="0.8" />
  <polygon points="198,236 222,202 242,232" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Center 100MP Optical Glass Core -->
  <circle cx="256" cy="256" r="32" fill="#0284c7" stroke="#38bdf8" stroke-width="4" />
  <circle cx="256" cy="256" r="18" fill="#ffffff" opacity="0.9" />
  <circle cx="248" cy="248" r="8" fill="#ffffff" />
</svg>
